<header class="header">
    <div class="header__inner">
        <a href="{{ get_url(path='/') }}" class="header__logo">
            <img src="{{ get_url(path='ferris-logo.png') }}" alt="Ferris" class="header__logo-icon">
            <span class="header__logo-text">Rust Colombia</span>
        </a>
        <nav class="header__nav">
            <a href="#eventos">{% if lang == "en" %}Events{% else %}Eventos{% endif %}</a>
            <a href="{{ get_url(path='blog') }}">Blog</a>
            <a href="#comunidad">{% if lang == "en" %}Community{% else %}Comunidad{% endif %}</a>
            <a href="#capitulos">{% if lang == "en" %}Chapters{% else %}Capítulos{% endif %}</a>
            <div class="lang-switcher">
                <a href="{{ get_url(path='/') }}" class="lang-switcher__btn {% if lang == 'es' %}lang-switcher__btn--active{% endif %}">ES</a>
                <a href="{{ get_url(path='/en/') }}" class="lang-switcher__btn {% if lang == 'en' %}lang-switcher__btn--active{% endif %}">EN</a>
            </div>
            <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
                <svg class="theme-toggle__icon theme-toggle__icon--sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                <svg class="theme-toggle__icon theme-toggle__icon--moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>
            <a href="{{ config.extra.meetup_url }}" target="_blank" class="btn btn--primary btn--sm">
                {% if lang == "en" %}Join Us{% else %}Únete{% endif %}
            </a>
        </nav>
    </div>
</header>
